<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TravelFrame Booking Card — Contemporary</title>
<style>
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 300; src: url("../fonts/BeVietnamPro-Light.ttf"); }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 400; src: url("../fonts/BeVietnamPro-Regular.ttf"); }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 500; src: url("../fonts/BeVietnamPro-Medium.ttf"); }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 600; src: url("../fonts/BeVietnamPro-SemiBold.ttf"); }
  @font-face { font-family: "Newsreader"; font-style: normal; src: url("../fonts/Newsreader.ttf"); }
  @font-face { font-family: "Newsreader"; font-style: italic; src: url("../fonts/Newsreader-Italic.ttf"); }

  :root {
    --wall: {{WALL}};
    --ink: #1A1F21;
    --ink-soft: #5B6266;
    --red: #BD100A;
    --rule: rgba(26, 31, 33, .18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: var(--wall); color: var(--ink);
    font-family: "Be Vietnam Pro", sans-serif; -webkit-font-smoothing: antialiased;
    position: relative; overflow: hidden;
  }
  body::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .24  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .top {
    position: absolute; top: 60px; left: 64px; right: 64px;
    display: flex; justify-content: space-between;
    font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
  }
  .top span:last-child { font-weight: 400; color: var(--ink-soft); }

  .art {
    position: absolute; left: 64px; top: 136px; width: 640px; height: 640px;
    object-fit: cover;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 74%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 74%, rgba(0,0,0,0) 100%);
  }

  /* the rule-breaking element: one word running down the right edge */
  .vword {
    position: absolute; right: 52px; top: 132px;
    writing-mode: vertical-rl;
    font-weight: 600; font-size: 168px; line-height: .8; letter-spacing: -5px;
    color: var(--ink);
  }
  .vword i { font-style: normal; color: var(--red); }

  .label { position: absolute; left: 64px; top: 806px; width: 760px; }
  .who { font-family: "Newsreader", serif; font-size: 50px; line-height: 1.05; letter-spacing: -.8px; }
  .title { font-family: "Newsreader", serif; font-style: italic; font-size: 50px; line-height: 1.05; letter-spacing: -.8px; }
  .title .yr { font-style: normal; }
  .medium { margin-top: 18px; font-size: 17px; line-height: 1.5; color: var(--ink-soft); font-weight: 300; }
  .medium b { font-weight: 500; color: var(--ink); }
  .gift { color: var(--red); font-weight: 500; }
  .note { display: inline-block; margin-top: 8px; font-size: 15px; color: var(--ink-soft); font-style: italic; }

  .facts {
    position: absolute; left: 64px; right: 64px; bottom: 64px;
    display: grid; grid-template-columns: 0.85fr 1.05fr 1.1fr 0.95fr auto; column-gap: 26px; align-items: end;
    border-top: 1.5px solid var(--ink); padding-top: 16px;
  }
  .k { font-size: 11.5px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: var(--ink-soft); }
  .v { font-size: 18px; font-weight: 500; margin-top: 6px; line-height: 1.3; }
  .v small { display: block; font-size: 13.5px; font-weight: 300; color: var(--ink-soft); }
  .logo { width: 58px; height: 58px; }
</style>
</head>
<body>
  <div class="top"><span>{{BRAND_LINE}}</span><span>{{REF_LINE}}</span></div>

  <img class="art" src="{{ART_URL}}" alt="">

  <div class="vword">{{VWORD}}</div>

  <section class="label">
    <div class="who">{{WHO}}</div>
    <div class="title">{{TITLE}}</div>
    <div class="medium">{{MEDIUM}}</div>
  </section>

  <footer class="facts">
    {{FACTS}}
    <img class="logo" src="../brand/travelframe-logo-round-415.png" alt="TravelFrame">
  </footer>
</body>
</html>
