<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TravelFrame Booking Card</title>
<style>
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 300; src: url("../fonts/BeVietnamPro-Light.ttf"); }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 400; src: url("../fonts/BeVietnamPro-Regular.ttf"); }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 500; src: url("../fonts/BeVietnamPro-Medium.ttf"); }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 600; src: url("../fonts/BeVietnamPro-SemiBold.ttf"); }
  @font-face { font-family: "Newsreader"; font-style: normal; src: url("../fonts/Newsreader.ttf"); }
  @font-face { font-family: "Newsreader"; font-style: italic; src: url("../fonts/Newsreader-Italic.ttf"); }
  @font-face { font-family: "Caveat"; src: url("../fonts/Caveat.ttf"); }

  :root {
    --paper: #FAF5EA;
    --ink: #1F2629;
    --ink-soft: #485156;
    --teal: #008AA3;
    --teal-deep: #0B5F6E;
    --brick: #A2452E;
    --ochre: #B07D2A;
    --brand-red: #BD100A;
    --rule: rgba(31, 38, 41, .14);
    --art-h: 760px;
    --art-pos: center 60%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Be Vietnam Pro", sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }
  /* paper grain */
  body::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .art {
    position: absolute; left: 0; top: 0; width: 100%; height: var(--art-h); z-index: 1;
    background-image: var(--art-url); background-size: cover; background-position: var(--art-pos);
  }
  .art.fade {
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 68%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 68%, rgba(0,0,0,0) 100%);
  }

  .logo { position: absolute; top: 44px; left: 48px; width: 96px; height: 96px; z-index: 3;
          filter: drop-shadow(0 4px 10px rgba(31,38,41,.18)); }

  /* postal-style stamp */
  .stamp {
    position: absolute; top: 40px; right: 46px; z-index: 3;
    width: 196px; height: 196px; transform: rotate(-9deg);
    color: var(--teal-deep);
  }
  .stamp svg { width: 100%; height: 100%; overflow: visible; }
  .stamp .ring { fill: rgba(250,245,234,.9); stroke: currentColor; stroke-width: 3; }
  .stamp .ring2 { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-dasharray: 2 4; }
  .stamp text { fill: currentColor; font-family: "Be Vietnam Pro"; }
  .stamp .arc { font-size: 12.5px; font-weight: 600; letter-spacing: 2.2px; }
  .stamp .big { font-size: 21px; font-weight: 600; letter-spacing: 1px; }
  .stamp .small { font-size: 13px; font-weight: 500; letter-spacing: 1px; }

  .panel {
    position: absolute; left: 72px; right: 72px; top: var(--panel-top, 640px); z-index: 2;
  }
  .eyebrow {
    font-size: 15px; font-weight: 600; letter-spacing: 3.4px; text-transform: uppercase; color: var(--teal);
    display: flex; align-items: center; gap: 14px;
  }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  h1 {
    font-family: "Newsreader", serif; font-weight: 400; font-size: 62px; line-height: 1.04;
    letter-spacing: -1.2px; margin-top: 16px; color: var(--ink);
  }
  h1 em { font-style: italic; color: var(--brick); }
  .for {
    font-family: "Caveat", cursive; font-size: 40px; line-height: 1; color: var(--brick);
    margin-top: 10px;
  }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; row-gap: 0;
    margin-top: 26px; border-top: 1px solid var(--rule);
  }
  .cell { padding: 15px 0 14px; border-bottom: 1px solid var(--rule); }
  .label { font-size: 12.5px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: var(--ink-soft); }
  .value { font-size: 19px; line-height: 1.36; font-weight: 400; margin-top: 5px; color: var(--ink); }
  .value strong { font-weight: 600; }
  .value .muted { color: var(--ink-soft); font-weight: 300; }

  .incl { margin-top: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
  .chip {
    font-size: 16px; font-weight: 500; padding: 8px 15px; border-radius: 999px;
    border: 1px solid rgba(0,138,163,.35); color: var(--teal-deep); background: rgba(0,138,163,.06);
  }
  .chip.gift { border-color: rgba(162,69,46,.38); color: var(--brick); background: rgba(162,69,46,.06); }
  .chip.gift::before { content: "✦ "; }

  .foot {
    position: absolute; left: 72px; right: 72px; bottom: 44px; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 14.5px; color: var(--ink-soft); letter-spacing: .3px;
    border-top: 1px solid var(--rule); padding-top: 16px;
  }
  .foot b { font-weight: 600; color: var(--ink); letter-spacing: 1.6px; }
</style>
</head>
<body style="--art-url: url('{{ART_URL}}'); --art-h: {{ART_H}}px; --art-pos: {{ART_POS}}; --panel-top: {{PANEL_TOP}}px;">
  <div class="art {{ART_FADE}}"></div>

  <img class="logo" src="../brand/travelframe-logo-round-415.png" alt="TravelFrame">

  <div class="stamp" aria-label="Deposit received">
    <svg viewBox="0 0 200 200">
      <defs><path id="arcTop" d="M 28 100 A 72 72 0 0 1 172 100"/><path id="arcBot" d="M 19 100 A 81 81 0 0 0 181 100"/></defs>
      <circle class="ring" cx="100" cy="100" r="96"/>
      <circle class="ring2" cx="100" cy="100" r="86"/>
      <text class="arc"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">TRAVELFRAME HANOI</textPath></text>
      <text class="arc"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">{{STAMP_BOTTOM}}</textPath></text>
      <text class="big" x="100" y="103" text-anchor="middle">CONFIRMED</text>
      <text class="small" x="100" y="124" text-anchor="middle">{{STAMP_DATE}}</text>
    </svg>
  </div>

  <main class="panel">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{HEADLINE}}</h1>
    <div class="for">{{FOR_LINE}}</div>

    <div class="grid">
      {{CELLS}}
    </div>

    <div class="incl">
      <div class="label">What's included</div>
      <div class="chips">{{CHIPS}}</div>
    </div>
  </main>

  <footer class="foot">
    <span>{{FOOT_LEFT}}</span>
    <span><b>{{FOOT_RIGHT}}</b></span>
  </footer>
</body>
</html>
