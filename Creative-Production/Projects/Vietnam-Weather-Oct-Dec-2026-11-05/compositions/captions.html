<template><style>#root{position:absolute;inset:0}.caption{position:absolute;left:127px;top:1192px;width:818px;text-align:center;font:700 39px/1.24 Arial,sans-serif;color:white;background:#1b1b1bf2;border-radius:10px;padding:14px 22px}</style><div id="root" data-composition-id="captions" data-width="1080" data-height="1920"><div id="caption0" class="clip caption" data-start="0" data-duration="1.299">Planning a Vietnam trip</div>
<div id="caption1" class="clip caption" data-start="1.299" data-duration="1.81">between October and December?</div>
<div id="caption2" class="clip caption" data-start="3.435" data-duration="2.065">Here’s something to know before you pack:</div>
<div id="caption3" class="clip caption" data-start="5.826" data-duration="1.579">the weather can feel very different</div>
<div id="caption4" class="clip caption" data-start="7.405" data-duration="1.358">from north to south.</div>
<div id="caption5" class="clip caption" data-start="9.089" data-duration="1.613">In Northern Vietnam,</div>
<div id="caption6" class="clip caption" data-start="10.714" data-duration="2.913">Hanoi usually starts to feel cooler in autumn.</div>
<div id="caption7" class="clip caption" data-start="13.837" data-duration="2.38">It’s a lovely time to wander the Old Quarter,</div>
<div id="caption8" class="clip caption" data-start="16.217" data-duration="2.507">stop for coffee and explore with your camera.</div>
<div id="caption9" class="clip caption" data-start="18.934" data-duration="2.391">By December, pack layers and a jacket —</div>
<div id="caption10" class="clip caption" data-start="21.419" data-duration="2.541">and warmer clothing if you’re heading to the mountains.</div>
<div id="caption11" class="clip caption" data-start="24.286" data-duration="1.289">In Central Vietnam,</div>
<div id="caption12" class="clip caption" data-start="25.575" data-duration="2.739">places like Huế, Đà Nẵng and Hội An</div>
<div id="caption13" class="clip caption" data-start="28.582" data-duration="2.043">can see heavy rain and storms</div>
<div id="caption14" class="clip caption" data-start="30.625" data-duration="1.903">during the later months of the year.</div>
<div id="caption15" class="clip caption" data-start="32.796" data-duration="1.578">Keep your plans flexible,</div>
<div id="caption16" class="clip caption" data-start="34.41" data-duration="3.284">and have a café or indoor activity in mind.</div>
<div id="caption17" class="clip caption" data-start="38.021" data-duration="1.995">Rain can continue into December,</div>
<div id="caption18" class="clip caption" data-start="40.11" data-duration="2.53">so check the forecast before you go.</div>
<div id="caption19" class="clip caption" data-start="42.85" data-duration="2.832">In Southern Vietnam, it stays warm.</div>
<div id="caption20" class="clip caption" data-start="45.845" data-duration="2.972">You may still see showers in October and November,</div>
<div id="caption21" class="clip caption" data-start="48.911" data-duration="2.715">while December generally brings drier weather.</div>
<div id="caption22" class="clip caption" data-start="51.952" data-duration="1.15">Wherever you’re going,</div>
<div id="caption23" class="clip caption" data-start="53.102" data-duration="2.681">check the local forecast close to your trip.</div>
<div id="caption24" class="clip caption" data-start="56.109" data-duration="1.868">And if Hanoi is on your list,</div>
<div id="caption25" class="clip caption" data-start="58.071" data-duration="2.089">save a little time to slow down,</div>
<div id="caption26" class="clip caption" data-start="60.195" data-duration="1.092">explore its streets</div>
<div id="caption27" class="clip caption" data-start="61.287" data-duration="2.077">and capture the moments in between.</div>
<div id="caption28" class="clip caption" data-start="63.69" data-duration="2.251">Save this for your Vietnam trip.</div></div><script>window.__timelines=window.__timelines||{};window.__timelines.captions=gsap.timeline({paused:true});</script></template>
