<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:"BVP";font-weight:300;src:url("fonts/BeVietnamPro-Light.ttf")}
@font-face{font-family:"BVP";font-weight:400;src:url("fonts/BeVietnamPro-Regular.ttf")}
@font-face{font-family:"BVP";font-weight:500;src:url("fonts/BeVietnamPro-Medium.ttf")}
@font-face{font-family:"BVP";font-weight:600;src:url("fonts/BeVietnamPro-SemiBold.ttf")}
@font-face{font-family:"IS";src:url("fonts/InstrumentSerif-Regular.ttf")}
@font-face{font-family:"SCRIPT";src:url("fonts/Lavonia.otf"),url("fonts/GreatVibes-Regular.ttf")}
@font-face{font-family:"NR";font-style:normal;src:url("fonts/Newsreader.ttf")}
@font-face{font-family:"NR";font-style:italic;src:url("fonts/Newsreader-Italic.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1536px}
body{background:#EFE4D9;color:#1A1F21;font-family:"BVP",sans-serif;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .24  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.top{position:absolute;left:60px;top:58px;font-size:15px;font-weight:600;letter-spacing:4px;text-transform:uppercase}
.art{position:absolute;left:30px;top:118px;width:700px;
 -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 74%,rgba(0,0,0,0) 100%);mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 74%,rgba(0,0,0,0) 100%)}
.v{position:absolute;right:44px;top:60px;writing-mode:vertical-rl;font-weight:600;font-size:230px;line-height:.8;letter-spacing:-6px;white-space:nowrap}
.v i{font-style:normal;color:#BD100A}
.h{position:absolute;left:60px;top:736px;width:720px;font-family:"IS",serif;font-size:92px;line-height:.98;letter-spacing:-1px}
.h em{display:block;font-family:"SCRIPT",cursive;font-style:normal;font-size:92px;line-height:1.1;color:#A2452E;margin-top:22px;margin-left:34px}
.rule{position:absolute;left:60px;top:984px;width:690px;border-top:1.5px solid #1A1F21}
.cols{position:absolute;left:60px;top:1008px;width:690px;display:grid;grid-template-columns:0.95fr 1.3fr 0.95fr;column-gap:24px}
.n{font-family:"IS",serif;font-size:72px;line-height:1;color:#BD100A}
.k{margin-top:16px;font-size:14px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase}
.t{margin-top:8px;font-size:17px;line-height:1.45;color:#5B6266;font-weight:300}
.btn{position:absolute;left:60px;top:1206px;background:#1A1F21;color:#fff;font-size:20px;font-weight:600;letter-spacing:3px;padding:24px 34px;text-transform:uppercase}
.btn span{color:#FF5A4F;margin-left:16px;letter-spacing:0;font-size:26px;line-height:0;position:relative;top:2px}
.foot{position:absolute;left:60px;top:1392px;width:690px;display:flex;justify-content:space-between;align-items:baseline;font-size:18px;color:#5B6266;border-top:1px solid rgba(26,31,33,.18);padding-top:14px}
.foot .sig{font-family:"SCRIPT",cursive;font-size:44px;color:#1A1F21}
</style></head><body>
<div class="top">TravelFrame — Hanoi</div>
<img class="art" src="hero-collage-A.jpg" alt="">
<div class="v">THANK YOU<i>.</i></div>
<div class="h">For trusting us with<br><em>your Hanoi story</em></div>
<div class="rule"></div>
<div class="cols">
 <div><div class="n">01</div><div class="k">Pick your date</div><div class="t">Send us a rough date.</div></div>
 <div><div class="n">02</div><div class="k">Before your walk</div><div class="t">Meeting point and outfit ideas.</div></div>
 <div><div class="n">03</div><div class="k">On the day</div><div class="t">We walk at your pace.</div></div>
</div>
<div class="btn">Tell us your date<span>→</span></div>
<div class="foot"><span class="sig">See you in Hanoi</span><span>@travelframe.vn</span></div>
</body></html>
